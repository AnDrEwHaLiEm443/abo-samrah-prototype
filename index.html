<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>أبو سمرة | اطلب أونلاين</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--o:#E85319;--o2:#ff8a4c;--od:#b93d0c;--ink:#1b120d;--bg:#fbf6f2;--card:#fff;--mu:#8b766b;--bd:#efe2d9;--ok:#16a34a;--bad:#dc2626;--r:18px;--sh:0 10px 30px -12px #6b2a0a33}
*{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}
body{font-family:Cairo,sans-serif;background:var(--bg);color:var(--ink);overflow-x:hidden}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}input,textarea,select{font-family:inherit;font-size:15px}
.btn{background:var(--o);color:#fff;border-radius:14px;padding:12px 20px;font-weight:700;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--od);transform:translateY(-1px)}.btn:disabled{background:#d6c9c1;transform:none;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--o);border:2px solid var(--o)}.btn.dark{background:var(--ink)}.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}.w{width:100%}
.in{width:100%;padding:12px 14px;border:1.5px solid var(--bd);border-radius:12px;background:#fff;outline:0;transition:.2s}.in:focus{border-color:var(--o);box-shadow:0 0 0 4px #e8531922}
label.l{display:block;font-size:13px;font-weight:700;color:var(--mu);margin:12px 0 4px}
/* header */
header{position:sticky;top:0;z-index:900;background:#fffc;backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.hb{max-width:1240px;margin:auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px}.brand img{width:44px;height:44px;border-radius:14px;object-fit:cover}
.brand small{display:block;font-size:11px;font-weight:600;color:var(--mu)}
.deliv{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--bd);border-radius:30px;padding:6px 14px;font-size:13px;font-weight:600;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}.ic{width:42px;height:42px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:19px;position:relative;transition:.2s}.ic:hover{background:var(--bd)}
.badge{position:absolute;top:-4px;left:-4px;background:var(--o);color:#fff;font-size:11px;font-weight:900;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.bump{animation:bump .5s}@keyframes bump{40%{transform:scale(1.35)}}
.who{font-size:13px;font-weight:700;background:var(--ink);color:#fff;border-radius:30px;padding:9px 16px}
/* hero slider */
.hero{max-width:1240px;margin:16px auto 0;padding:0 16px}
.slider{position:relative;border-radius:28px;overflow:hidden;height:300px;box-shadow:var(--sh)}
.slides{display:flex;height:100%;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.slide{flex:0 0 100%;position:relative;display:flex;align-items:center;padding:0 48px;color:#fff;overflow:hidden}
.slide img{position:absolute;left:0;top:0;width:58%;height:100%;object-fit:cover;mask-image:linear-gradient(to left,transparent,#000 40%);-webkit-mask-image:linear-gradient(to left,transparent,#000 40%);transform:scale(1.1);transition:transform 6s}
.slide.on img{transform:scale(1)}
.slide .tx{position:relative;max-width:46%}.slide h2{font-size:clamp(24px,4vw,42px);font-weight:900;line-height:1.2;opacity:0;transform:translateY(20px);transition:.6s .3s}
.slide p{font-size:18px;margin:8px 0 18px;opacity:0;transform:translateY(20px);transition:.6s .45s}.slide .btn{background:#fff;color:var(--ink);opacity:0;transition:.6s .6s}
.slide.on h2,.slide.on p,.slide.on .btn{opacity:1;transform:none}
.slide .until{position:absolute;bottom:16px;right:48px;font-size:12px;opacity:.8}
.dots{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:8px;background:#fff8;transition:.3s;cursor:pointer}.dots i.on{width:26px;background:#fff}
.perks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.perk{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;font-size:13px;font-weight:600}.perk b{font-size:22px}
/* menu */
.cats{position:sticky;top:65px;z-index:800;background:var(--bg);padding:12px 0}
.cats .in-wrap{max-width:1240px;margin:auto;padding:0 16px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chip{flex:none;padding:9px 18px;border-radius:30px;background:#fff;border:1px solid var(--bd);font-weight:700;font-size:14px;transition:.25s}.chip.on{background:var(--o);color:#fff;border-color:var(--o);box-shadow:0 6px 16px -6px var(--o)}
main{max-width:1240px;margin:auto;padding:0 16px 120px}
.search{margin:10px 0 0;position:relative}.search input{padding-right:42px}.search span{position:absolute;right:14px;top:11px}
h3.sec{font-size:24px;font-weight:900;margin:28px 0 14px;display:flex;align-items:center;gap:10px}h3.sec:after{content:"";flex:1;height:2px;background:linear-gradient(to left,var(--bd),transparent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);overflow:hidden;border:1px solid var(--bd);transition:.3s;cursor:pointer;display:flex;flex-direction:column;animation:up .5s both}
.card:hover{transform:translateY(-6px);box-shadow:var(--sh)}
@keyframes up{from{opacity:0;transform:translateY(24px)}}
.card .im{height:160px;background:#f3ebe5;position:relative;overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover .im img{transform:scale(1.08)}
.tag{position:absolute;top:10px;right:10px;background:var(--o);color:#fff;font-size:11px;font-weight:900;padding:4px 10px;border-radius:20px}
.card .bd{padding:12px 14px;flex:1;display:flex;flex-direction:column;gap:4px}.card h4{font-size:16px}.card p{font-size:12px;color:var(--mu);flex:1}
.card .ft{display:flex;align-items:center;justify-content:space-between;margin-top:6px}.pr{font-weight:900;color:var(--o)}.pr small{font-size:11px;color:var(--mu);font-weight:600}
.plus{width:36px;height:36px;border-radius:12px;background:var(--ink);color:#fff;font-size:22px;transition:.2s}.card:hover .plus{background:var(--o);transform:rotate(90deg)}
/* overlay, modal, drawer */
.ov{position:fixed;inset:0;background:#1b120d88;backdrop-filter:blur(3px);z-index:1900;opacity:0;pointer-events:none;transition:.3s}.ov.on{opacity:1;pointer-events:auto}
.modal{position:fixed;z-index:2000;left:50%;top:50%;width:min(560px,calc(100% - 24px));max-height:calc(100vh - 40px);overflow:auto;background:#fff;border-radius:24px;transform:translate(-50%,-45%) scale(.95);opacity:0;pointer-events:none;transition:.35s cubic-bezier(.2,.9,.3,1.2)}
.modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.mh{position:sticky;top:0;background:#fff;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--bd)}.mh h3{font-size:19px}
.x{width:34px;height:34px;border-radius:50%;background:var(--bg);font-size:20px}.mb{padding:16px 20px}.mf{position:sticky;bottom:0;background:#fff;padding:14px 20px;border-top:1px solid var(--bd);display:flex;gap:10px;align-items:center}
.mimg{height:220px;margin:-16px -20px 14px;overflow:hidden}.mimg img{width:100%;height:100%;object-fit:cover}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:.2s}
.opt:has(input:checked){border-color:var(--o);background:#fff4ee}.opt input{accent-color:var(--o);width:18px;height:18px}.opt span{flex:1;font-weight:600}.opt b{color:var(--o);font-size:14px}
.gh{display:flex;justify-content:space-between;font-weight:900;margin:14px 0 8px}.gh small{font-weight:600;color:var(--mu);background:var(--bg);padding:2px 10px;border-radius:10px}
.qty{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:12px;padding:4px}.qty button{width:34px;height:34px;border-radius:10px;background:#fff;font-size:18px;font-weight:900;color:var(--o)}.qty b{min-width:20px;text-align:center}
.drawer{position:fixed;top:0;bottom:0;left:0;width:min(420px,100%);background:#fff;z-index:2000;transform:translateX(-105%);transition:.4s cubic-bezier(.7,0,.2,1);display:flex;flex-direction:column}.drawer.on{transform:none}
.line{display:flex;gap:10px;padding:12px 0;border-bottom:1px dashed var(--bd);animation:up .3s}.line img{width:62px;height:62px;border-radius:12px;object-fit:cover}.line .i{flex:1;font-size:14px}.line small{display:block;color:var(--mu);font-size:12px}
.empty{text-align:center;color:var(--mu);padding:50px 10px}.empty div{font-size:60px;animation:float 3s infinite}@keyframes float{50%{transform:translateY(-10px)}}
/* pages */
.page{max-width:1100px;margin:auto;padding:24px 16px 120px;animation:up .4s}.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px;align-items:start}
.box{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:18px;margin-bottom:16px}.box h3{font-size:18px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.addr{border:1.5px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;transition:.2s}.addr.on{border-color:var(--o);background:#fff4ee}.addr .t{flex:1;font-size:13px}.addr .t b{font-size:15px}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:8px}.prefs .opt{margin:0;font-size:13px}
.sum div{display:flex;justify-content:space-between;padding:5px 0;font-size:14px}.sum .g{font-size:20px;font-weight:900;border-top:2px dashed var(--bd);margin-top:8px;padding-top:12px}.sum .g span:last-child{color:var(--o)}
.note{font-size:12px;color:var(--mu);background:var(--bg);border-radius:10px;padding:8px 10px;margin-top:8px}
.zone{padding:10px 12px;border-radius:12px;font-weight:700;font-size:13px;margin-top:8px}.zok{background:#e8f8ee;color:var(--ok)}.zbad{background:#fde9e9;color:var(--bad)}.zid{background:var(--bg);color:var(--mu)}
#amap{height:240px;border-radius:14px;border:1px solid var(--bd);margin-top:8px}
.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:6px;margin-bottom:16px;overflow-x:auto}.tabs button{flex:1;padding:10px 14px;border-radius:12px;font-weight:700;white-space:nowrap}.tabs button.on{background:var(--ink);color:#fff}
.ord{display:flex;gap:12px;align-items:center;padding:14px;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;background:#fff}.ord .i{flex:1;font-size:13px}
.st{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px;background:#fff4ee;color:var(--o)}.st.delivered{background:#e8f8ee;color:var(--ok)}.st.cancelled{background:#fde9e9;color:var(--bad)}
.track{display:flex;justify-content:space-between;position:relative;margin:24px 0 10px}.track:before{content:"";position:absolute;top:22px;right:6%;left:6%;height:4px;background:var(--bd);border-radius:4px}
.track .bar{position:absolute;top:22px;right:6%;height:4px;background:var(--o);border-radius:4px;transition:width 1s}
.stp{position:relative;text-align:center;flex:1;font-size:12px;font-weight:700;color:var(--mu)}.stp i{width:48px;height:48px;border-radius:50%;background:#fff;border:3px solid var(--bd);display:grid;place-items:center;margin:0 auto 6px;font-style:normal;font-size:20px;transition:.4s}
.stp.done i{border-color:var(--o);background:var(--o)}.stp.done{color:var(--ink)}.stp.cur i{animation:pulse 1.6s infinite}@keyframes pulse{0%{box-shadow:0 0 0 0 #e8531977}100%{box-shadow:0 0 0 16px #e8531900}}
.pts{background:linear-gradient(135deg,var(--o),var(--od));color:#fff;border-radius:22px;padding:24px;position:relative;overflow:hidden}.pts h2{font-size:44px;font-weight:900}.pts:after{content:"⭐";position:absolute;left:20px;top:10px;font-size:90px;opacity:.2;animation:float 4s infinite}
/* chat */
.chatb{position:fixed;bottom:20px;right:20px;z-index:1500;width:60px;height:60px;border-radius:50%;background:var(--ink);color:#fff;font-size:26px;box-shadow:var(--sh);transition:.3s}.chatb:hover{transform:scale(1.1) rotate(-8deg)}
.chat{position:fixed;bottom:90px;right:20px;width:min(360px,calc(100% - 32px));height:480px;background:#fff;border-radius:22px;box-shadow:0 20px 60px #0004;z-index:1600;display:flex;flex-direction:column;overflow:hidden;transform:translateY(20px) scale(.9);transform-origin:bottom right;opacity:0;pointer-events:none;transition:.3s}.chat.on{transform:none;opacity:1;pointer-events:auto}
.chat .h{background:var(--o);color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center}.chat .h img{width:38px;height:38px;border-radius:50%}.chat .h small{display:block;opacity:.85;font-size:11px}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.msg{max-width:80%;padding:9px 13px;border-radius:16px;font-size:14px;animation:up .3s}.msg.u{align-self:flex-start;background:var(--o);color:#fff;border-bottom-right-radius:4px}.msg.s{align-self:flex-end;background:#fff;border:1px solid var(--bd);border-bottom-left-radius:4px}.msg small{display:block;font-size:10px;opacity:.7}
.chat form{display:flex;gap:6px;padding:10px;border-top:1px solid var(--bd)}
.fab{position:fixed;bottom:20px;left:50%;transform:translate(-50%,120px);z-index:1400;background:var(--o);color:#fff;border-radius:18px;padding:14px 22px;font-weight:900;display:flex;gap:16px;box-shadow:0 12px 30px -8px var(--o);transition:.4s cubic-bezier(.2,.9,.3,1.3);width:min(440px,calc(100% - 120px));justify-content:space-between}.fab.on{transform:translate(-50%,0)}
.toast{position:fixed;top:80px;left:50%;transform:translate(-50%,-30px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:14px;z-index:3000;opacity:0;transition:.35s;font-weight:700;pointer-events:none}.toast.on{opacity:1;transform:translate(-50%,0)}
.fly{position:fixed;z-index:3000;width:50px;height:50px;border-radius:50%;object-fit:cover;pointer-events:none;transition:all .7s cubic-bezier(.6,-.3,.7,1)}
footer{background:var(--ink);color:#d9c8be;text-align:center;padding:30px 16px 90px;font-size:14px}footer img{width:70px;border-radius:18px;margin-bottom:8px}
.demo{background:#fff4ee;border:1px dashed var(--o);color:var(--od);font-size:12px;border-radius:10px;padding:8px 10px;margin-top:10px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.perks{grid-template-columns:1fr 1fr}.deliv{display:none}.slider{height:240px}.slide{padding:0 20px}.slide .tx{max-width:70%}.slide img{width:80%;opacity:.55}.slide p{font-size:14px}.brand small{display:none}.prefs{grid-template-columns:1fr}.fab{width:calc(100% - 110px);left:auto;right:90px;transform:translateY(120px)}.fab.on{transform:none}}
</style>
</head>
<body>
<header><div class="hb">
  <a class="brand" href="#" onclick="go('home')"><img src="logo.jpg" alt=""><div>أبو سمرة<small>أصل الحكاية بجد</small></div></a>
  <button class="deliv" onclick="me()?go('account','addresses'):auth()" id="deliv">📍 التوصيل إلى: اختر عنوانك</button>
  <div class="sp"></div>
  <button class="ic" title="طلباتي" onclick="me()?go('account','orders'):auth()">🧾</button>
  <button class="ic" title="السلة" onclick="openCart()" id="cartIc">🛒<span class="badge" id="cc" hidden>0</span></button>
  <button class="who" id="who" onclick="me()?go('account','profile'):auth()">دخول</button>
</div></header>
<div id="view"></div>
<footer><img src="logo.jpg" alt=""><br><b>أبو سمرة</b> — اللبيني الهرم، شارع السيسي، أمام مركز شباب السيسي<br>☎ 01018197684 • واتساب 01157707019<br><small>جميع الأسعار شاملة ضريبة القيمة المضافة 14%</small></footer>

<button class="fab" id="fab" onclick="openCart()"><span>🛒 عرض السلة</span><span id="fabT"></span></button>
<button class="chatb" onclick="toggleChat()" title="خدمة العملاء">💬</button>
<div class="chat" id="chat"><div class="h"><img src="logo.jpg" alt=""><div style="flex:1"><b>خدمة عملاء أبو سمرة</b><small>● متصلين الآن — بنرد خلال دقائق</small></div><button class="x" style="color:#fff;background:#fff2" onclick="toggleChat()">×</button></div>
  <div class="msgs" id="msgs"></div><form onsubmit="sendMsg(event)"><input class="in" id="mi" placeholder="اكتب رسالتك..." autocomplete="off"><button class="btn">➤</button></form></div>
<div class="ov" id="ov" onclick="closeAll()"></div>
<div class="modal" id="modal"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="core.js"></script>
<script>
const $=id=>document.getElementById(id);
let db=DB.get(),route='home',sub='',slideI=0,slideT,cart=load('as_cart',[]),ck={addr:null,pref:null,coupon:'',usePts:false,pay:'cash',note:''};
function load(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
const me=()=>{const id=load('as_session',null);return db.users.find(u=>u.id===id)};
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),2200)}
function go(r,s=''){route=r;sub=s;closeAll();render();scrollTo(0,0)}
function closeAll(){['ov','modal','drawer'].forEach(i=>$(i).classList.remove('on'))}
function modal(html){$('modal').innerHTML=html;$('modal').classList.add('on');$('ov').classList.add('on')}
onDB(()=>{db=DB.get();if(route!=='home'||!$('modal').classList.contains('on'))render(true);renderChat()});

/* ---------- header / cart state ---------- */
function head(){
  const u=me(),n=cart.reduce((a,l)=>a+l.qty,0),t=cart.reduce((a,l)=>a+linePrice(l),0);
  $('who').textContent=u?'👤 '+u.name.split(' ')[0]:'دخول / تسجيل';
  const a=u&&(u.addresses.find(a=>a.id===ck.addr)||u.addresses[0]);
  $('deliv').textContent='📍 التوصيل إلى: '+(a?LABELS[a.label]+' — '+a.street:'اختر عنوانك');
  $('cc').hidden=!n;$('cc').textContent=n;$('fabT').textContent=n+' صنف • '+egp(t);
  $('fab').classList.toggle('on',!!n&&route==='home'&&!$('drawer').classList.contains('on'));
}
function render(soft){
  db=DB.get();head();
  if(route==='home'){if(!soft)home()}
  else if(route==='checkout')checkout();
  else if(route==='account')account();
  else if(route==='track')track();
}

/* ---------- home ---------- */
function home(){
  const offers=db.offers.filter(o=>inRange(o));
  const cats=db.cats.filter(c=>db.items.some(i=>i.cat===c&&i.active));
  $('view').innerHTML=`
  <section class="hero">${offers.length?`<div class="slider"><div class="slides" id="slides">${offers.map(o=>`
    <div class="slide" style="background:${esc(o.color)}"><img src="${esc(o.img)}" alt=""><div class="tx"><h2>${esc(o.title)}</h2><p>${esc(o.sub)}</p><button class="btn" onclick="document.getElementById('menu').scrollIntoView()">اطلب دلوقتي ←</button></div><span class="until">العرض ساري حتى ${esc(o.to)}</span></div>`).join('')}</div>
    <div class="dots">${offers.map((_,i)=>`<i onclick="slide(${i})"></i>`).join('')}</div></div>`:''}
    <div class="perks"><div class="perk"><b>🛵</b>توصيل سريع 30-45 دقيقة</div><div class="perk"><b>⭐</b>اكسب نقاط مع كل طلب</div><div class="perk"><b>🔥</b>مشويات على الفحم</div><div class="perk"><b>💳</b>كاش أو فيزا عند الاستلام</div></div>
  </section>
  <nav class="cats" id="cats"><div class="in-wrap">${cats.map((c,i)=>`<button class="chip ${i?'':'on'}" onclick="toCat(${i})">${esc(c)}</button>`).join('')}</div></nav>
  <main id="menu"><div class="search"><span>🔎</span><input class="in" placeholder="ابحث عن أكلتك المفضلة..." oninput="filter(this.value)"></div>
  ${cats.map((c,ci)=>`<section class="catsec" data-c="${ci}"><h3 class="sec" id="c${ci}">${esc(c)}</h3><div class="grid">${db.items.filter(i=>i.cat===c&&i.active).map((i,k)=>`
    <div class="card" data-n="${esc(i.name)}" style="animation-delay:${k*.05}s" onclick="openItem('${i.id}')">
      <div class="im"><img src="${esc(i.img)}" alt="" loading="lazy">${i.badge?`<span class="tag">${esc(i.badge)}</span>`:''}</div>

   ${o.status==='cancelled'?'<p class="zone zbad">تم إلغاء الطلب. تواصل مع خدمة العملاء لأي استفسار.</p>':`
   <div class="track"><div class="bar" style="width:${Math.max(0,k)/(FLOW.length-1)*88}%"></div>${FLOW.map((s,i)=>`<div class="stp ${i<=k?'done':''} ${i===k&&s!=='delivered'?'cur':''}"><i>${icons[i]}</i>${STATUS[s]}</div>`).join('')}</div>
   <p style="color:var(--mu)">${o.status==='delivered'?'بالهنا والشفا! ⭐ تمت إضافة '+o.earn+' نقطة لحسابك':'الوقت المتوقع للتوصيل: 30-45 دقيقة'}</p>`}</div>
   <div class="box"><h3>تفاصيل الطلب</h3>${o.items.map(l=>`<div class="sum"><div><span>${l.qty}× ${esc(l.name)} (${esc(l.size.n)})</span><span>${egp(linePrice(l))}</span></div></div>`).join('')}
    <div class="sum"><div><span>التوصيل</span><span>${egp(o.fee)}</span></div>${o.disc+o.ptsDisc?`<div><span>خصومات</span><span>-${egp(o.disc+o.ptsDisc)}</span></div>`:''}<div class="g"><span>الإجمالي</span><span>${egp(o.total)}</span></div></div>
    <div class="note">📍 ${LABELS[o.addr.label]} — ${esc(o.addr.street)}<br>${PREFS[o.pref]}</div>
    <div style="display:flex;gap:8px;margin-top:12px"><button class="btn dark" style="flex:1" onclick="toggleChat(true)">💬 تواصل معنا</button><button class="btn ghost" style="flex:1" onclick="reorder('${o.id}')">🔁 إعادة الطلب</button></div></div></div>`;
}
function reorder(id){const o=db.orders.find(o=>o.id===id);cart=o.items.map(l=>({...l,key:Date.now()+Math.random()+''}));save('as_cart',cart);toast('تمت إضافة الأصناف للسلة');go('home');setTimeout(openCart,300)}

/* ---------- account ---------- */
function account(){
  const u=me();if(!u)return go('home');sub=sub||'orders';
  const os=db.orders.filter(o=>o.userId===u.id),T={orders:'🧾 طلباتي',addresses:'📍 عناويني',points:'⭐ نقاطي',profile:'👤 حسابي'};
  let b='';
  if(sub==='orders')b=os.length?os.map(o=>`<div class="ord"><img src="${esc(o.items[0].img)}" style="width:56px;height:56px;border-radius:12px;object-fit:cover" alt=""><div class="i"><b>#${o.id}</b> • ${new Date(o.at).toLocaleString('ar-EG')}<br>${o.items.map(l=>l.qty+'× '+esc(l.name)).join('، ')}<br><span class="st ${o.status}">${STATUS[o.status]}</span> <b class="pr">${egp(o.total)}</b></div><div style="display:flex;flex-direction:column;gap:6px"><button class="btn sm" onclick="go('track','${o.id}')">تتبع</button><button class="btn sm ghost" onclick="reorder('${o.id}')">إعادة</button></div></div>`).join(''):'<div class="empty"><div>🧾</div><p>لا توجد طلبات بعد</p></div>';
  if(sub==='addresses')b=`<button class="btn w" style="margin-bottom:12px" onclick="addrForm()">+ إضافة عنوان (المنزل / العمل / المكتب / العائلة)</button>`+u.addresses.map(a=>`<div class="addr"><div class="t"><b>${LABELS[a.label]}</b><br>${esc(a.street)} ${a.bld?'- عمارة '+esc(a.bld):''} ${a.floor?'- دور '+esc(a.floor):''}<br><small>${PREFS[a.pref]}</small></div><button class="btn sm ghost" onclick="addrForm('${a.id}')">تعديل</button><button class="btn sm dark" onclick="delAddr('${a.id}')">حذف</button></div>`).join('');
  if(sub==='points')b=`<div class="pts"><small>رصيد نقاطك</small><h2>${u.points}</h2><p>= ${egp(u.points*db.settings.pointValue)} — اكسب نقطة لكل ${db.settings.pointsPer} ج.م</p></div><div class="box" style="margin-top:12px"><h3>سجل النقاط</h3>${(u.pointsLog||[]).map(p=>`<div class="sum"><div><span>${esc(p.t)} <small style="color:var(--mu)">${new Date(p.at).toLocaleDateString('ar-EG')}</small></span><b style="color:${p.p>0?'var(--ok)':'var(--bad)'}">${p.p>0?'+':''}${p.p}</b></div></div>`).join('')}</div>`;
  if(sub==='profile')b=`<form class="box" onsubmit="saveProf(event)"><label class="l">الاسم</label><input class="in" name="name" value="${esc(u.name)}"><label class="l">الموبايل</label><input class="in" value="${esc(u.phone)}" disabled><label class="l">البريد</label><input class="in" name="email" value="${esc(u.email||'')}"><button class="btn" style="margin-top:14px">حفظ</button> <button type="button" class="btn ghost" style="margin-top:14px" onclick="logout()">تسجيل الخروج</button></form>`;
  $('view').innerHTML=`<div class="page"><h2 style="margin-bottom:14px">أهلاً ${esc(u.name)} 👋</h2><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===sub?'on':''}" onclick="go('account','${k}')">${v}</button>`).join('')}</div>${b}</div>`;
}
function saveProf(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));DB.edit(d=>Object.assign(d.users.find(x=>x.id===me().id),f));toast('تم الحفظ');render()}

/* ---------- support chat ---------- */
function toggleChat(force){if(!me()){auth();return}$('chat').classList.toggle('on',force??!$('chat').classList.contains('on'));renderChat();$('mi').focus()}
function renderChat(){
  const u=me();if(!u)return;const m=db.chats[u.id]||[];
  $('msgs').innerHTML=`<div class="msg s">أهلاً ${esc(u.name)} 👋 إزاي نقدر نساعدك؟</div>`+m.map(x=>`<div class="msg ${x.from}">${esc(x.t)}<small>${x.from==='s'&&x.by?esc(x.by)+' • ':''}${new Date(x.at).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('');
  $('msgs').scrollTop=1e6;
}
function sendMsg(e){e.preventDefault();const t=$('mi').value.trim();if(!t)return;const u=me();DB.edit(d=>{(d.chats[u.id]=d.chats[u.id]||[]).push({from:'u',t,at:Date.now(),unread:true})});$('mi').value='';db=DB.get();renderChat()}

render();renderChat();
</script>
</body>
</html>
